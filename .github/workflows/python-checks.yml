name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.14
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
