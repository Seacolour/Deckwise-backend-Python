[project]
name = "deckwise-python"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=6.0.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
